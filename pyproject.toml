[project]
name = "csa-lab4"
version = "1.0.0"
description = "Лабораторная работа 4: Lisp -> CISC-процессор (trap, port, POLY, pipeline)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PL",
    "RUF",
]
ignore = [
    "PLR0913",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"test_golden.py" = ["ARG001"]
"machine.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
